<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI캠퍼스 | 실무에 바로 쓰는 AI 교육 과정</title>
<meta name="description" content="바이브코딩, 업무자동화, AI 영상, 마케팅, AI 자격증, 중장년 국비과정까지. 실습과 결과물 중심의 AI캠퍼스 교육 과정.">
<meta property="og:type" content="website">
<meta property="og:title" content="AI캠퍼스 | 실무에 바로 쓰는 AI 교육 과정">
<meta property="og:description" content="바이브코딩 · 업무자동화 · AI 영상 · 마케팅 · AI 자격증 · 중장년 국비과정. 과정별 상세 커리큘럼은 상담 시 안내드립니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316181d'/%3E%3Ctext x='16' y='21' font-size='13' font-family='Arial' font-weight='700' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#16181d;--ink2:#353b46;--ink3:#5c6370;--line:#e3e5e9;--bg2:#f6f7f9;--dc:#16181d}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:#fff;line-height:1.65;letter-spacing:-.01em;word-break:keep-all;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
@media(min-width:1024px){.wrap{padding:0 48px}}

/* header */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.links{display:flex;gap:26px;margin-left:auto;font-size:15.5px;font-weight:700;color:var(--ink2)}
.links a:hover{color:var(--ink)}
.cta-s{padding:10px 18px;border-radius:9px;background:var(--ink);color:#fff;font-size:15px;font-weight:800}
@media(max-width:760px){.links{display:none}.cta-s{margin-left:auto;padding:8px 14px;font-size:14px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:10px;font-weight:800;font-size:16px;white-space:nowrap}
.btn-main{background:var(--ink);color:#fff}
.btn-main:hover{background:#000}
.btn-line{border:1px solid #cfd3d9;color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
@media(min-width:1024px){.btn{height:56px;padding:0 28px;font-size:16.5px}}

/* hero */
.hero{padding:64px 0 56px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1fr 420px;gap:64px;align-items:end}
.eyebrow{font-size:14.5px;font-weight:800;color:var(--ink3);letter-spacing:.02em}
.hero h1{margin-top:14px;font-size:clamp(32px,4.6vw,58px);line-height:1.22;font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:#2f62e6}
.hero .lead{margin-top:18px;font-size:clamp(16px,1.5vw,19px);color:var(--ink2);max-width:620px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
.contact-card{border:1px solid var(--line);border-radius:14px;padding:24px 26px}
.contact-card small{font-size:14px;font-weight:700;color:var(--ink3)}
.contact-card .tel{display:block;margin-top:6px;font-size:30px;font-weight:800;letter-spacing:-.02em}
.contact-card .tel span{font-size:18px;color:var(--ink2);font-weight:700;margin-left:6px}
.contact-card p{margin-top:10px;font-size:14.5px;color:var(--ink2)}
.stats{display:flex;gap:28px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.stats div b{display:block;font-size:24px;font-weight:800}
.stats div span{font-size:13.5px;color:var(--ink3);font-weight:700}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:32px}.hero{padding:40px 0}}

/* featured (국비) */
.feat{margin-top:44px}
.feat-card{display:grid;grid-template-columns:1.2fr 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.feat-l{padding:32px 34px;border-right:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:6px;background:color-mix(in srgb,var(--dc) 12%,#fff);color:var(--dc)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--dc)}
.feat-l h2{margin-top:12px;font-size:clamp(21px,2.2vw,28px);line-height:1.35;font-weight:800;letter-spacing:-.03em}
.feat-l p{margin-top:10px;font-size:16.5px;color:var(--ink2)}
.feat-l .btn{margin-top:22px}
.feat-r{padding:26px 30px;background:var(--bg2)}
.feat-r table{width:100%;border-collapse:collapse}
.feat-r th,.feat-r td{padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px;text-align:left}
.feat-r tr:last-child th,.feat-r tr:last-child td{border-bottom:0}
.feat-r th{color:var(--ink3);font-weight:700;width:96px}
.feat-r td{font-weight:700}
@media(max-width:860px){.feat-card{grid-template-columns:1fr}.feat-l{border-right:0;border-bottom:1px solid var(--line);padding:24px}.feat-r{padding:18px 24px}}

/* catalog */
.sec{padding:64px 0 90px;scroll-margin-top:64px}
.sh{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding-bottom:16px;margin-bottom:22px;border-bottom:1px solid var(--ink)}
.sh h2{font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:-.03em}
.sh p{margin-left:auto;font-size:15px;color:var(--ink3);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-weight:700;color:var(--ink2);background:#fff}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dc)}
.chip small{font-size:13px;color:var(--ink3);font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"] small{color:#c9ccd2}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:1180px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;transition:border-color .15s}
.card:hover{border-color:#aeb3bb}
.cv{aspect-ratio:16/9;background:color-mix(in srgb,var(--dc) 10%,#fff);position:relative;overflow:hidden}
.cv img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;background:#fff}
.cv .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;color:var(--dc);font-weight:800;font-size:15px}
.cv .ph b{font-size:20px;color:var(--ink);line-height:1.3;margin-top:2px;letter-spacing:-.02em}
.bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.bd h3{font-size:17.5px;line-height:1.42;font-weight:800;letter-spacing:-.02em}
.bd p{font-size:14.5px;color:var(--ink2)}
.ft{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink3)}

/* detail */
.detail{padding:28px 0 90px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--ink2);margin-bottom:22px}
.back:hover{color:var(--ink)}
.d-head{display:grid;grid-template-columns:1fr 480px;gap:48px;align-items:start}
.d-head h1{margin-top:12px;font-size:clamp(26px,3.2vw,42px);line-height:1.28;font-weight:800;letter-spacing:-.035em}
.d-head .hook{margin-top:14px;font-size:clamp(16.5px,1.6vw,20px);color:var(--ink2)}
.d-head .cv{border-radius:14px;border:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:26px}
.facts div{padding:14px 16px;border-radius:12px;background:var(--bg2)}
.facts dt{font-size:13px;font-weight:700;color:var(--ink3)}
.facts dd{margin-top:2px;font-size:16px;font-weight:800}
.d-head .actions{margin-top:24px}
@media(max-width:960px){.d-head{grid-template-columns:1fr;gap:24px}.d-head .cv{order:-1}}

.d-body{display:grid;grid-template-columns:380px 1fr;gap:48px;margin-top:56px}
@media(max-width:960px){.d-body{grid-template-columns:1fr;gap:36px;margin-top:40px}}
.d-body h2{font-size:21px;font-weight:800;letter-spacing:-.02em;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--ink)}
.dash{list-style:none}
.dash li{position:relative;padding:14px 0 14px 22px;border-bottom:1px solid var(--line);font-size:16.5px;color:var(--ink2)}
.dash li::before{content:"";position:absolute;left:2px;top:27px;width:9px;height:2px;background:var(--dc)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tools span{font-size:13.5px;font-weight:700;padding:5px 11px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);color:var(--ink2)}
.note{margin-top:16px;font-size:14.5px;color:var(--ink2);padding:14px 16px;border-radius:10px;background:var(--bg2)}

.tl{position:relative;padding-left:38px;margin-top:18px;display:grid;gap:12px}
.tl::before{content:"";position:absolute;left:10px;top:28px;bottom:28px;width:2px;background:var(--line)}
.st{position:relative;display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center;padding:20px 24px;border:1px solid var(--line);border-radius:12px;background:#fff}
.st::before{content:"";position:absolute;left:-36px;top:50%;transform:translateY(-50%);width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--dc)}
.st:last-child::before{background:var(--dc)}
.st small{display:block;font-size:13px;font-weight:800;color:var(--dc)}
.st b{font-size:18px;font-weight:800}
.st p{font-size:16px;color:var(--ink2)}
@media(max-width:720px){.st{grid-template-columns:1fr;gap:4px;padding:16px 18px}.st::before{top:24px;transform:none}}

.lock{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 26px;border:1px dashed #b9bec6;border-radius:12px}
.lock b{font-size:17px}
.lock p{font-size:15px;color:var(--ink2);margin-top:2px}
.more{margin-top:70px}

/* closing */
.close{padding:72px 0;background:var(--bg2);text-align:center}
.close h2{font-size:clamp(23px,2.6vw,32px);font-weight:800;letter-spacing:-.03em}
.close p{margin:10px 0 24px;font-size:17px;color:var(--ink2)}
.close .actions{justify-content:center}
footer{padding:28px 0 110px;border-top:1px solid var(--line);font-size:14px;color:var(--ink3)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:72px}
.bar-t{font-size:15.5px;color:var(--ink2)}
.bar-t b{color:var(--ink);font-size:17px}
.bar .btn{height:48px;font-size:15.5px}
@media(max-width:560px){.bar-t .bx{display:none}.bar .btn{padding:0 18px}}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.dim{position:absolute;inset:0;background:rgba(17,19,24,.48)}
.sheet{position:relative;width:100%;max-width:460px;background:#fff;border-radius:16px;padding:30px 26px 24px}
.sheet h3{font-size:21px;font-weight:800}
.sheet>p{font-size:15px;color:var(--ink3);margin:4px 0 20px}
.x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:8px;color:var(--ink3);font-size:18px}
.x:hover{background:var(--bg2)}
.opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.opt:hover{border-color:var(--ink3)}
.oi{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:#fff}
.opt.tel .oi{background:#e9f7ef;color:#0a8f6b}
.ot{flex:1}
.ot b{display:block;font-size:16.5px}
.ot span{font-size:14px;color:var(--ink3)}
.arr{color:var(--ink3);font-size:20px}
@media(max-width:560px){.modal{align-items:flex-end;padding:0}.sheet{max-width:none;border-radius:16px 16px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>

<script>

      + '<h1>배우고 끝나는 AI 말고,<br><em>바로 써먹는 AI</em></h1>'
      + '<p class="lead">바이브코딩, 업무자동화, AI 영상, 마케팅, 자격증까지. 실습과 결과물 중심으로 내 일에 바로 적용하는 AI 교육 과정입니다.</p>'
      + '<div class="actions"><a class="btn btn-main" href="#" data-go="courses">전체 과정 보기</a><button class="btn btn-line" data-contact>무료 상담 신청</button></div>'
      + '</div><aside class="contact-card"><small>과정 상담 문의</small><a class="tel" data-tel href="' + telHref + '">' + esc(MAIN_TEL) + (ext ? '<span>내선 ' + esc(ext) + '</span>' : '') + '</a>'
      + '<p>지금 수준과 목표에 맞는 과정을 1:1로 안내드립니다.</p>'
      + '<div class="stats"><div><b>' + total + '</b><span>개 과정</span></div><div><b>' + deptCount + '</b><span>개 분야</span></div><div><b>1:1</b><span>맞춤 상담</span></div></div></aside></div></section>'
      + (k ? '<div class="wrap feat"><div class="feat-card" style="--dc:' + COLOR[k.dept] + '"><div class="feat-l"><span class="badge"><i></i>국비지원 · 모집중</span><h2>' + esc(k.title) + '</h2><p>' + esc(k.hook) + '</p><a class="btn btn-main" href="#' + k.id + '">과정 자세히 보기</a></div>'
          + '<div class="feat-r"><table>' + k.facts.map(function(f){ return '<tr><th>' + esc(f[0]) + '</th><td>' + esc(f[1]) + '</td></tr>'; }).join('') + '</table></div></div></div>' : '')
      + '<section class="sec" id="courses"><div class="wrap"><div class="sh"><h2>전체 과정</h2><p>과정을 누르면 커리큘럼 요약을 볼 수 있습니다</p></div>'
      + '<div class="chips" id="chips"></div><div class="grid" id="grid"></div></div></section>';
    drawChips(); drawGrid();
    if(scrollTo){ var t = document.getElementById(scrollTo); if(t) t.scrollIntoView(); } else window.scrollTo(0, 0);
  }

  function drawChips(){
    var list = [['전체', '#16181d']].concat(DEPTS.filter(function(d){ return COURSES.some(function(c){ return c.dept === d[0]; }); }));
    document.getElementById('chips').innerHTML = list.map(function(d){
      var n = d[0] === '전체' ? COURSES.length : COURSES.filter(function(c){ return c.dept === d[0]; }).length;
      return '<button class="chip" data-f="' + esc(d[0]) + '" style="--dc:' + d[1] + '" aria-pressed="' + (filter === d[0]) + '">' + (d[0] === '전체' ? '' : '<i></i>') + esc(d[0]) + ' <small>' + n + '</small></button>';
    }).join('');
  }
  function drawGrid(){
    var list = COURSES.filter(function(c){ return filter === '전체' || c.dept === filter; });
    document.getElementById('grid').innerHTML = list.map(card).join('');
  }

  function renderCourse(c){
    var others = COURSES.filter(function(x){ return x.dept === c.dept && x.id !== c.id; });
    if(others.length < 3) others = others.concat(COURSES.filter(function(x){ return x.dept !== c.dept && x.id !== c.id; })).slice(0, 4);
    else others = others.slice(0, 4);
    app.innerHTML =
      '<div class="detail" style="--dc:' + COLOR[c.dept] + '"><div class="wrap">'
      + '<a class="back" href="#">‹ 전체 과정</a>'
      + '<div class="d-head"><div><span class="badge"><i></i>' + esc(c.dept) + (c.featured ? ' · 모집중' : '') + '</span>'
      + '<h1>' + esc(c.title) + '</h1><p class="hook">' + esc(c.hook) + '</p>'
      + '<dl class="facts">' + c.facts.map(function(f){ return '<div><dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd></div>'; }).join('') + '</dl>'
      + '<div class="actions"><button class="btn btn-main" data-contact>이 과정 상담 신청</button><a class="btn btn-line" data-tel href="' + telHref + '">' + esc(telLabel) + '</a></div></div>'
      + cover(c, true) + '</div>'
      + '<div class="d-body"><div><h2>이런 분께 추천합니다</h2><ul class="dash">' + c.target.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'
      + '<div class="tools">' + c.tools.map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') + '</div>'
      + (c.note ? '<p class="note">' + esc(c.note) + '</p>' : '') + '</div>'
      + '<div><h2>커리큘럼</h2><div class="tl">' + c.steps.map(function(s, i){ return '<div class="st"><div><small>STEP ' + (i + 1) + '</small><b>' + esc(s[0]) + '</b></div><p>' + esc(s[1]) + '</p></div>'; }).join('') + '</div>'
      + '<div class="lock"><div><b>회차별 세부 커리큘럼 · 결과물 예시</b><p>상세 커리큘럼과 일정은 상담 시 자료로 직접 안내드립니다.</p></div><button class="btn btn-main" data-contact>상세 커리큘럼 받아보기</button></div></div></div>'
      + '<div class="more"><div class="sh"><h2>함께 보면 좋은 과정</h2></div><div class="grid">' + others.map(card).join('') + '</div></div>'
      + '</div></div>';
    document.getElementById('mSub').textContent = c.title;
    document.title = c.title + ' | AI캠퍼스';
    window.scrollTo(0, 0);
  }

  function route(scrollTo){
    var id = location.hash.slice(1);
    var c = COURSES.filter(function(x){ return x.id === id; })[0];
    document.getElementById('mSub').textContent = '편한 방법을 선택해 주세요';
    document.title = 'AI캠퍼스 | 실무에 바로 쓰는 AI 교육 과정';
    if(c) renderCourse(c); else renderHome(scrollTo);
  }

  document.addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if(chip){ filter = chip.dataset.f; drawChips(); drawGrid(); return; }
    var go = e.target.closest('[data-go]');
    if(go){
      e.preventDefault();
      var target = go.dataset.go;
      if(target === 'contact'){ document.getElementById('contact').scrollIntoView({behavior:'smooth'}); return; }
      if(location.hash && location.hash !== '#'){ history.pushState(null, '', location.pathname); route(target); }
      else { var t = document.getElementById(target); if(t) t.scrollIntoView({behavior:'smooth'}); }
      return;
    }
    if(e.target.closest('[data-contact]')) openM();
    if(e.target.closest('[data-close]')) closeM();
  });

  var m = document.getElementById('modal');
  function openM(){ m.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeM(){ m.classList.remove('open'); document.body.style.overflow = ''; }
  m.querySelectorAll('a.opt').forEach(function(a){ a.addEventListener('click', function(){ setTimeout(closeM, 300); }); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeM(); });

  window.addEventListener('hashchange', function(){ route(); });
  window.addEventListener('popstate', function(){ route(); });
  route();
})();
</script>
</body>
</html>
