<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI캠퍼스 | 실무에 바로 쓰는 AI 교육 과정</title>
<meta name="description" content="바이브코딩, 업무자동화, AI 영상, 마케팅, AI 자격증, 중장년 국비과정까지. 실습과 결과물 중심의 AI캠퍼스 교육 과정.">
<meta property="og:type" content="website">
<meta property="og:title" content="AI캠퍼스 | 실무에 바로 쓰는 AI 교육 과정">
<meta property="og:description" content="바이브코딩 · 업무자동화 · AI 영상 · 마케팅 · AI 자격증 · 중장년 국비과정. 국비과정 · 일반과정 상세 커리큘럼을 확인하세요.">
<meta property="og:url" content="https://ligless.github.io/curriculum/seo.html">
<meta property="og:site_name" content="AI캠퍼스">
<meta property="og:image" content="https://ligless.github.io/curriculum/campus-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ligless.github.io/curriculum/campus-og.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316181d'/%3E%3Ctext x='16' y='21' font-size='13' font-family='Arial' font-weight='700' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#16181d;--ink2:#353b46;--ink3:#5c6370;--line:#e3e5e9;--bg2:#f6f7f9;--dc:#16181d}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:#fff;line-height:1.65;letter-spacing:-.01em;word-break:keep-all;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
@media(min-width:1024px){.wrap{padding:0 48px}}

/* header */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.links{display:flex;gap:26px;margin-left:auto;font-size:15.5px;font-weight:700;color:var(--ink2)}
.links a:hover{color:var(--ink)}
.cta-s{padding:10px 18px;border-radius:9px;background:var(--ink);color:#fff;font-size:15px;font-weight:800}
@media(max-width:760px){.links{display:none}.cta-s{margin-left:auto;padding:8px 14px;font-size:14px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:10px;font-weight:800;font-size:16px;white-space:nowrap}
.btn-main{background:var(--ink);color:#fff}
.btn-main:hover{background:#000}
.btn-line{border:1px solid #cfd3d9;color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
@media(min-width:1024px){.btn{height:56px;padding:0 28px;font-size:16.5px}}

/* hero */
.hero{padding:64px 0 56px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1fr 420px;gap:64px;align-items:end}
.eyebrow{font-size:14.5px;font-weight:800;color:var(--ink3);letter-spacing:.02em}
.hero h1{margin-top:14px;font-size:clamp(32px,4.6vw,58px);line-height:1.22;font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:#2f62e6}
.hero .lead{margin-top:18px;font-size:clamp(16px,1.5vw,19px);color:var(--ink2);max-width:620px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
.contact-card{border:1px solid var(--line);border-radius:14px;padding:24px 26px}
.contact-card small{font-size:14px;font-weight:700;color:var(--ink3)}
.contact-card .tel{display:block;margin-top:6px;font-size:30px;font-weight:800;letter-spacing:-.02em}
.contact-card .tel span{font-size:18px;color:var(--ink2);font-weight:700;margin-left:6px}
.contact-card p{margin-top:10px;font-size:14.5px;color:var(--ink2)}
.stats{display:flex;gap:28px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.stats div b{display:block;font-size:24px;font-weight:800}
.stats div span{font-size:13.5px;color:var(--ink3);font-weight:700}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:32px}.hero{padding:40px 0}}

/* featured (국비) */
.feat{margin-top:44px}
.feat-card{display:grid;grid-template-columns:1.2fr 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.feat-l{padding:32px 34px;border-right:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:6px;background:color-mix(in srgb,var(--dc) 12%,#fff);color:var(--dc)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--dc)}
.feat-l h2{margin-top:12px;font-size:clamp(21px,2.2vw,28px);line-height:1.35;font-weight:800;letter-spacing:-.03em}
.feat-l p{margin-top:10px;font-size:16.5px;color:var(--ink2)}
.feat-l .btn{margin-top:22px}
.feat-r{padding:26px 30px;background:var(--bg2)}
.feat-r table{width:100%;border-collapse:collapse}
.feat-r th,.feat-r td{padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px;text-align:left}
.feat-r tr:last-child th,.feat-r tr:last-child td{border-bottom:0}
.feat-r th{color:var(--ink3);font-weight:700;width:96px}
.feat-r td{font-weight:700}
@media(max-width:860px){.feat-card{grid-template-columns:1fr}.feat-l{border-right:0;border-bottom:1px solid var(--line);padding:24px}.feat-r{padding:18px 24px}}

/* catalog */
.sec{padding:64px 0 90px;scroll-margin-top:64px}
.sh{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding-bottom:16px;margin-bottom:22px;border-bottom:1px solid var(--ink)}
.sh h2{font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:-.03em}
.sh p{margin-left:auto;font-size:15px;color:var(--ink3);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-weight:700;color:var(--ink2);background:#fff}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dc)}
.chip small{font-size:13px;color:var(--ink3);font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"] small{color:#c9ccd2}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:1180px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;transition:border-color .15s}
.card:hover{border-color:#aeb3bb}
.cv{position:relative;aspect-ratio:16/9;background:color-mix(in srgb,var(--dc) 10%,#fff);position:relative;overflow:hidden}
.cv img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;background:#fff}
.cv .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;color:var(--dc);font-weight:800;font-size:15px}
.cv .ph b{font-size:20px;color:var(--ink);line-height:1.3;margin-top:2px;letter-spacing:-.02em}
.bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.bd h3{font-size:17.5px;line-height:1.42;font-weight:800;letter-spacing:-.02em}
.bd p{font-size:14.5px;color:var(--ink2)}
.ft{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink3)}

/* detail */
.detail{padding:28px 0 90px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--ink2);margin-bottom:22px}
.back:hover{color:var(--ink)}
.d-head{display:grid;grid-template-columns:1fr 480px;gap:48px;align-items:start}
.d-head h1{margin-top:12px;font-size:clamp(26px,3.2vw,42px);line-height:1.28;font-weight:800;letter-spacing:-.035em}
.d-head .hook{margin-top:14px;font-size:clamp(16.5px,1.6vw,20px);color:var(--ink2)}
.d-head .cv{border-radius:14px;border:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:26px}
.facts div{padding:14px 16px;border-radius:12px;background:var(--bg2)}
.facts dt{font-size:13px;font-weight:700;color:var(--ink3)}
.facts dd{margin-top:2px;font-size:16px;font-weight:800}
.d-head .actions{margin-top:24px}
@media(max-width:960px){.d-head{grid-template-columns:1fr;gap:24px}.d-head .cv{order:-1}}

.d-body{display:grid;grid-template-columns:380px 1fr;gap:48px;margin-top:56px}
@media(max-width:960px){.d-body{grid-template-columns:1fr;gap:36px;margin-top:40px}}
.d-body h2{font-size:21px;font-weight:800;letter-spacing:-.02em;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--ink)}
.dash{list-style:none}
.dash li{position:relative;padding:14px 0 14px 22px;border-bottom:1px solid var(--line);font-size:16.5px;color:var(--ink2)}
.dash li::before{content:"";position:absolute;left:2px;top:27px;width:9px;height:2px;background:var(--dc)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tools span{font-size:13.5px;font-weight:700;padding:5px 11px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);color:var(--ink2)}
.note{margin-top:16px;font-size:14.5px;color:var(--ink2);padding:14px 16px;border-radius:10px;background:var(--bg2)}

.tl{position:relative;padding-left:38px;margin-top:18px;display:grid;gap:12px}
.tl::before{content:"";position:absolute;left:10px;top:28px;bottom:28px;width:2px;background:var(--line)}
.st{position:relative;display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center;padding:20px 24px;border:1px solid var(--line);border-radius:12px;background:#fff}
.st::before{content:"";position:absolute;left:-36px;top:50%;transform:translateY(-50%);width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--dc)}
.st:last-child::before{background:var(--dc)}
.st small{display:block;font-size:13px;font-weight:800;color:var(--dc)}
.st b{font-size:18px;font-weight:800}
.st p{font-size:16px;color:var(--ink2)}
@media(max-width:720px){.st{grid-template-columns:1fr;gap:4px;padding:16px 18px}.st::before{top:24px;transform:none}}

.lock{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 26px;border:1px dashed #b9bec6;border-radius:12px}
.lock b{font-size:17px}
.lock p{font-size:15px;color:var(--ink2);margin-top:2px}
.more{margin-top:70px}

/* closing */
.close{padding:72px 0;background:var(--bg2);text-align:center}
.close h2{font-size:clamp(23px,2.6vw,32px);font-weight:800;letter-spacing:-.03em}
.close p{margin:10px 0 24px;font-size:17px;color:var(--ink2)}
.close .actions{justify-content:center}
footer{padding:28px 0 110px;border-top:1px solid var(--line);font-size:14px;color:var(--ink3)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:72px}
.bar-t{font-size:15.5px;color:var(--ink2)}
.bar-t b{color:var(--ink);font-size:17px}
.bar .btn{height:48px;font-size:15.5px}
@media(max-width:560px){.bar-t .bx{display:none}.bar .btn{padding:0 18px}}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.dim{position:absolute;inset:0;background:rgba(17,19,24,.48)}
.sheet{position:relative;width:100%;max-width:460px;background:#fff;border-radius:16px;padding:30px 26px 24px}
.sheet h3{font-size:21px;font-weight:800}
.sheet>p{font-size:15px;color:var(--ink3);margin:4px 0 20px}
.x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:8px;color:var(--ink3);font-size:18px}
.x:hover{background:var(--bg2)}
.opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.opt:hover{border-color:var(--ink3)}
.oi{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:#fff}
.opt.tel .oi{background:#e9f7ef;color:#0a8f6b}
.ot{flex:1}
.ot b{display:block;font-size:16.5px}
.ot span{font-size:14px;color:var(--ink3)}
.arr{color:var(--ink3);font-size:20px}
@media(max-width:560px){.modal{align-items:flex-end;padding:0}.sheet{max-width:none;border-radius:16px 16px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom))}}

/* ---- 상세 커리큘럼 (detail 있는 과정) ---- */
.units{list-style:none;margin-top:8px;display:grid;gap:4px}
.units li{position:relative;padding-left:14px;font-size:15px;color:var(--ink)}
.units li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--dc)}
.dx{margin-top:64px;display:grid;gap:56px}
.dx h2{font-size:21px;font-weight:800;letter-spacing:-.02em;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--ink)}
.dx p.tx{font-size:16.5px;color:var(--ink2);max-width:980px}
.dx p.tx+p.tx{margin-top:10px}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ph3{border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.ph3 small{font-size:13px;font-weight:800;color:var(--dc)}
.ph3 b{display:block;font-size:19px;font-weight:800;margin:2px 0 12px}
.ph3 dl{display:grid;gap:10px}
.ph3 dt{font-size:13px;font-weight:800;color:var(--ink3)}
.ph3 dd{font-size:15.5px;color:var(--ink2)}
@media(max-width:860px){.phs{grid-template-columns:1fr}}
.tooltb{width:100%;border-collapse:collapse}
.tooltb th,.tooltb td{padding:13px 0;border-bottom:1px solid var(--line);font-size:16px;text-align:left}
.tooltb th{width:240px;font-weight:800}
.tooltb td{color:var(--ink2)}
@media(max-width:560px){.tooltb th{width:45%}}
.dx2{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media(max-width:860px){.dx2{grid-template-columns:1fr;gap:56px}}
.bgd details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.bgd summary{cursor:pointer;padding:16px 20px;font-weight:800;font-size:16px;list-style:none;display:flex;justify-content:space-between}
.bgd summary::-webkit-details-marker{display:none}
.bgd summary::after{content:"+";color:var(--ink3);font-weight:700}
.bgd details[open] summary::after{content:"−"}
.bgd details p{padding:0 20px 18px;font-size:15.5px;color:var(--ink2)}
.cta-box{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 26px;border-radius:12px;background:color-mix(in srgb,var(--dc) 8%,#fff);border:1px solid color-mix(in srgb,var(--dc) 25%,#fff)}
.cta-box b{font-size:17px}
.cta-box p{font-size:15px;color:var(--ink2);margin-top:2px}

/* ---- 국비 / 일반 분류 ---- */
.cat{position:absolute;top:12px;left:12px;z-index:2;font-size:15px;font-weight:800;padding:6px 12px;border-radius:7px;color:#fff;letter-spacing:.02em;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.cat.static{position:static;display:inline-block;box-shadow:none;font-size:14px;padding:4px 10px;vertical-align:middle}
.cat-g{background:#0b7a6e}.cat-n{background:#2f62e6}
.d-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px;max-width:640px}
.p2{display:block;padding:20px 22px;border-radius:14px;border:2px solid var(--line);background:#fff;transition:border-color .15s}
.p2 b{display:block;font-size:22px;font-weight:800}
.p2 span{display:block;font-size:15px;color:var(--ink2);margin-top:2px}
.p2 em{display:block;font-style:normal;font-size:15px;font-weight:800;margin-top:10px}
.p2-g b,.p2-g em{color:#0b7a6e}.p2-g:hover{border-color:#0b7a6e}
.p2-n b,.p2-n em{color:#2f62e6}.p2-n:hover{border-color:#2f62e6}
@media(max-width:520px){.pick2{grid-template-columns:1fr}}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ct{padding:12px 22px;border-radius:10px;border:2px solid var(--line);font-size:17px;font-weight:800;color:var(--ink2);background:#fff}
.ct small{font-size:14px;margin-left:4px;opacity:.75}
.ct[aria-pressed="true"]{color:#fff}
.ct-a[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.ct-g[aria-pressed="true"]{background:#0b7a6e;border-color:#0b7a6e}
.ct-n[aria-pressed="true"]{background:#2f62e6;border-color:#2f62e6}
.grp{margin-top:18px}
.grp+.grp{margin-top:56px}
.grp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.grp-h h3{font-size:24px;font-weight:800;letter-spacing:-.02em}
.grp-h p{font-size:15.5px;color:var(--ink2)}
/* ---- 원본 상세 커리큘럼 ---- */
.full{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:56px;margin-top:56px}
@media(max-width:1100px){.full{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.prose{max-width:900px;font-size:17px;color:var(--ink2)}
.prose h2{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.025em;margin:48px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--ink);scroll-margin-top:84px}
.prose h2:first-child{margin-top:0}
.prose h3{font-size:19.5px;font-weight:800;color:var(--ink);margin:30px 0 8px}
.prose h4{font-size:17.5px;font-weight:800;color:var(--ink);margin:20px 0 6px}
.prose p{margin:8px 0}
.prose ul{margin:6px 0 12px;padding-left:22px}
.prose ul ul{margin:4px 0}
.prose li{margin:5px 0}
.prose li::marker{color:var(--dc)}
.prose b{color:var(--ink)}
.prose blockquote{margin:14px 0;padding:14px 20px;border-left:4px solid var(--dc);background:var(--bg2);border-radius:0 10px 10px 0}
.prose hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.prose figure{margin:18px 0}
.prose figure img{border-radius:12px;border:1px solid var(--line);margin:0 auto}
.tbl{overflow-x:auto;margin:14px 0}
.tbl table{border-collapse:collapse;font-size:15.5px;min-width:100%}
.tbl td{border:1px solid var(--line);padding:10px 12px;vertical-align:top}
.tbl tr:first-child td{background:var(--bg2);font-weight:700;color:var(--ink)}
.toc{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 110px);overflow:auto}
.toc h5{font-size:14px;font-weight:800;color:var(--ink3);margin-bottom:8px}
.toc a{display:block;padding:8px 12px;border-radius:8px;font-size:15px;color:var(--ink2);line-height:1.45}
.toc a:hover{background:var(--bg2);color:var(--ink)}

: "Q1. <b>코딩을</b> <b>몰라도</b> <b>수강할</b> <b>수</b> <b>있나요</b>?"}, {"t": "p", "h": "본 과정은 어려운 코딩 없이 자연어로 프롬프트를 작성하는 방식으로 진행됩니다. AI가 익숙하지 않은 입문자와 IT 비전공자도 참여할 수 있도록 AI의 기본 개념부터 단계적으로 구성되어 있"}, {"t": "p", "h": "습니다."}, {"t": "h3", "h": "Q2. <b>이</b> <b>과정에서는</b> <b>어떤</b> <b>내용을</b> <b>배우나요</b>?"}, {"t": "p", "h": "AI와 생성형 AI의 개념, LLM의 작동 원리, AI의 학습 방식, 환각 대응법, 프롬프트 구성요소, 하이퍼파라미터, Zero-shot·Few-shot, 페르소나·Chain of Thought·제약조건, AI 윤리와 보 안, A형·B형 및 서술형 문제 풀이까지 학습합니다."}, {"t": "h3", "h": "Q3. <b>수업에서는</b> <b>어떤</b> <b>도구를</b> <b>사용하나요</b>?"}, {"t": "p", "h": "Google의 생성형 AI 서비스인 Gemini를 중심으로 수업과 실습을 진행합니다."}, {"t": "h3", "h": "Q4. <b>수강</b> <b>전에</b> <b>준비해야</b> <b>할</b> <b>것은</b> <b>무엇인가요</b>?"}, {"t": "p", "h": "Google 계정과 Gemini 실습 환경이 필요합니다. Zoom 라이브 수업에 참여할 수 있는 PC 또는 노트북과 안정적인 인터넷 환경도 준비해야 합니다."}, {"t": "h3", "h": "Q5. <b>유료</b> <b>구독이</b> <b>꼭</b> <b>필요한가요</b>?"}, {"t": "p", "h": "교육자료에는 Gemini 구독이 필수로 안내되어 있습니다. 다만 API Key 사용 여부와 계정 상태에 따라 무료 사용 또는 사용량 기반 과금이 적용될 수 있으므로 수강 전에 사용하는 계정의 요 금제와 과금 설정을 확인해야 합니다."}, {"t": "h3", "h": "Q6. AI-POT 2<b>급을</b> <b>먼저</b> <b>취득해야</b> <b>하나요</b>?"}, {"t": "p", "h": "교육자료 기준으로 2급 과정을 거치지 않고 AI-POT 1급 시험을 바로 준비하는 과정으로 구성되어 있습니다. 실제 시험의 응시자격과 운영 기준은 시험 접수 전 주관기관의 최신 안내를 확인 해야 합니다."}, {"t": "h3", "h": "Q7. <b>수업은</b> <b>어떤</b> <b>방식으로</b> <b>진행되나요</b>?"}, {"t": "p", "h": "주 2회씩 2주 동안 총 4회, 8시간의 Zoom 라이브 수업으로 진행됩니다. 강사의 설명을 들은 후 Gemini에 프롬프트를 직접 입력하고 실시간 피드백을 받는 이론·실습형 구성입니다."}, {"t": "h3", "h": "Q8. <b>최종적으로</b> <b>어떤</b> <b>수준까지</b> <b>준비하나요</b>?"}, {"t": "p", "h": "AI-POT 1급 시험의 핵심 이론과 A형·B형·서술형 문제를 학습하고, 시험에서 필요한 프롬프트작성과 하이퍼파라미터 활용 능력을 준비합니다. 생성형 AI를 업무에 활용하기 위한 실무 프롬프팅 역량도 함께 강화합니다."}, {"t": "h3", "h": "Q9. <b>수강하면</b> <b>자격증에</b> <b>반드시</b> <b>합격할</b> <b>수</b> <b>있나요</b>?"}, {"t": "p", "h": "본 과정은 AI-POT 1급 자격시험 대비를 위한 이론과 실전문제 풀이를 제공하지만 실제 합격을 보장하지는 않습니다. 수업 참여와 함께 핵심 개념 복습 및 개인별 문제 풀이가 필요합니다."}, {"t": "h3", "h": "Q10. GTQ AI 1<b>급도</b> <b>함께</b> <b>준비하는</b> <b>과정인가요</b>?"}, {"t": "p", "h": "본 과정의 중심 목표는 AI-POT 1급 시험 대비입니다. 교육자료에는 GTQ AI 자격증으로 이어지는 이미지 생성 프롬프팅 기초도 강의 목표로 제시되어 있으나, GTQ AI 1급의 전체 시험 범위를 별도로 준비하는 과정인지는 상담 시 확인이 필요합니다."}, {"t": "h3", "h": "Q11. <b>과정</b> <b>수료</b> <b>후</b> <b>어떤</b> <b>결과를</b> <b>기대할</b> <b>수</b> <b>있나요</b>?"}, {"t": "p", "h": "AI-POT 1급 시험에 필요한 핵심 이론과 문제 유형을 정리하고, 목적·역할·조건·출력 형식을 반영한 프롬프트를 작성할 수 있습니다. 또한 이미지 생성 프롬프팅의 기초를 익혀 AI 관련 공모전이나 실무 콘텐츠 제작으로 활용 범위를 확장할 수 있습니다."}, {"t": "hr"}, {"t": "h2", "h": "👨‍🏫 <b>강사</b> <b>소개</b>"}, {"t": "h3", "h": "<b>김</b> <b>유</b> <b>준</b>"}, {"t": "p", "h": "<b>학력</b>"}, {"t": "li", "h": "한양사이버대학교 대학원 도시건축공학과 석사"}, {"t": "li", "h": "한국방송통신대학교 영상학과 학사"}, {"t": "p", "h": "<b>실무경력</b>"}, {"t": "li", "h": "㈜디에스지코리아 책임연구원"}, {"t": "li", "h": "㈜DSG 과장"}, {"t": "li", "h": "한국수자원공사 BIM 데이터 구축 프로젝트 PM"}, {"t": "li", "h": "소방재난본부 요양원 디지털트윈 데이터 구축 프로젝트 PM"}, {"t": "li", "h": "인천지하철 디지털트윈 데이터 구축 프로젝트 PM"}, {"t": "p", "h": "<b>강의경력</b>"}, {"t": "li", "h": "SBS아카데미컴퓨터학원 Revit 강사"}, {"t": "li", "h": "SBS아카데미컴퓨터학원 SketchUp 강사"}, {"t": "li", "h": "코리아AI캠퍼스 AI-POT(프롬프트 활용능력) 1급 강사"}, {"t": "li", "h": "K-디지털 기초역량훈련 「파이썬을 활용한 AI 모델링·데이터 기반 AI 과정」 수료"}, {"t": "li", "h": "초·중·고 AI 코딩 강사"}, {"t": "p", "h": "“<b>비전공자가</b> 2<b>주</b> <b>만에</b> AI<b>에</b> <b>대한</b> <b>두려움을</b> <b>깨고</b>, AI<b>에게</b> <b>똑똑하게</b> <b>일시키는</b> <b>방법과</b> AI-POT 1<b>급</b> <b>자격시험을</b> <b>함께</b> <b>준비하는</b> <b>몰입형</b> <b>과정입니다</b>.”", "q": 1}, {"t": "hr"}, {"t": "h2", "h": "🎤 Instructor Interview"}, {"t": "h3", "h": "<b>본인</b> <b>또는</b> <b>본인의</b> <b>강의를</b> <b>한문장으로</b> <b>표현한다면</b>?"}, {"t": "p", "h": "비전공자가 2주 만에 AI에 대한 두려움을 깨고, AI에게 똑똑하게 일을 시키는 방법과 AI-POT 1 급 자격시험을 함께 준비하는 2<b>주</b> <b>몰입</b> <b>완성과정</b>입니다."}, {"t": "p", "h": "이 강의는 복잡한 코딩을 배우는 과정이 아니라, ChatGPT와 Gemini 같은 생성형 AI에 원하는 목적과 조건을 정확하게 전달하고 결과를 제어하는 실전 프롬프팅 능력을 길러드립니다."}, {"t": "h3", "h": "<b>본인을</b> <b>소개하고</b> <b>왜</b> <b>본인의</b> <b>수업을</b> <b>추천하는지</b>?"}, {"t": "p", "h": "저 역시 비전공자에서 출발해 직장생활과 대학원 학업을 병행하며 생성형 AI를 실제 업무와 학습에 활용해왔습니다. 그렇기 때문에 처음 AI를 접하는 분들이 어떤 부분에서 막막함을 느끼고, 어떤 용어와 기능을 어렵게 생각하는지 잘 이해하고 있습니다."}, {"t": "p", "h": "AI-POT 1급은 단순한 AI 사용 경험을 넘어, 생성형 AI를 목적에 맞게 제어하는 프롬프트 활용능력을 객관적으로 확인하는 자격시험입니다. AI 활용 역량을 체계적으로 정리하고, 이를 이력서와 실무에서 보여줄 수 있는 자격 스펙으로 연결할 수 있습니다."}, {"t": "p", "h": "수업에서는 Gemini 등 접근하기 쉬운 AI 도구를 활용해 시험의 핵심인 프롬프트 구조화와 하이퍼파라미터를 집중적으로 연습합니다. 어려운 코딩이나 복잡한 개발환경 없이 자연어 지시문을 작성하고, 결과를 비교하고, 부족한 조건을 수정하는 방식으로 진행합니다."}, {"t": "p", "h": "Zoom 라이브 실습과 실시간 피드백을 통해 비전공자와 입문자도 2급 과정을 별도로 거치지 않고 2주, 총 8시간 동안 AI-POT 1급 시험의 핵심 내용을 집중적으로 준비할 수 있도록 안내하겠습니다."}, {"t": "h3", "h": "<b>본인</b> <b>강의의</b> <b>강점과</b> <b>추구미는</b>?"}, {"t": "p", "h": "“<b>복잡한</b> <b>코딩보다</b> <b>프롬프트</b> <b>구조화에</b> <b>집중하고</b>, AI<b>를</b> <b>업무에</b> <b>바로</b> <b>활용할</b> <b>수</b> <b>있도록</b> <b>만드는</b> <b>수</b> <b>업</b>.”"}, {"t": "p", "h": "제 강의의 가장 큰 강점은 직장인이자 대학원생이며 비전공자로 출발한 경험을 바탕으로, 수강생의 눈높이에 맞는 현장 밀착형 Zoom 라이브 코칭을 제공한다는 점입니다."}, {"t": "p", "h": "AI를 처음 접하는 수강생에게 생소한 개념을 일방적으로 설명하는 데서 끝나지 않습니다. 프롬프트에 어떤 역할과 목적, 조건을 넣어야 하는지 직접 작성해보고, 하이퍼파라미터에 따라 결과가 어떻게 달라지는지 확인하며, 시험의 서술형 문제에서 자주 발생하는 조건 누락과 감점 요소까지 함께 점검합니다."}, {"t": "p", "h": "제가 추구하는 방향은 AI를 어렵게 공부해야 하는 기술이 아니라, <b>업무를</b> <b>더</b> <b>정확하고</b> <b>효율적으</b><b>로</b> <b>수행하도록</b> <b>지시할</b> <b>수</b> <b>있는</b> <b>실용적인</b> <b>도구</b>로 체득하게 만드는 것입니다."}, {"t": "p", "h": "배운 내용을 즉시 일상과 업무에 적용해 반복 작업을 줄이고, 생성형 AI 활용에 대한 자신감을 높이며, 단기간에 자격시험까지 함께 준비할 수 있는 확실한 학습 경험을 지향합니다."}, {"t": "h3", "h": "<b>학습자에게</b> <b>하고</b> <b>싶은</b> <b>말</b>"}, {"t": "p", "h": "AI가 어렵게 느껴져 도전을 주저하고 계셨다면 전혀 걱정하지 않으셔도 됩니다. 저 역시 비전공자로 시작해 무료 AI 도구를 활용하며 업무와 학업의 효율을 높여왔습니다."}, {"t": "p", "h": "이번 과정에서는 Gemini를 활용해 시험에 필요한 프롬프트 작성법을 기초부터 차근차근 연습합니다. AI의 원리를 이해하고, 질문을 구조화하고, 답변을 조절하는 방법을 익히다 보면 막연하게만 느껴졌던 생성형 AI를 훨씬 편안하게 활용할 수 있게 될 것입니다."}, {"t": "p", "h": "처음부터 모든 개념을 완벽하게 알고 시작할 필요는 없습니다. 2주 동안 수업에 참여하며 핵심이론과 문제 유형을 하나씩 정리하면 AI 활용에 대한 자신감과 자격시험을 준비할 수 있는 기반을 함께 만들 수 있습니다."}, {"t": "p", "h": "여러분의 AI 활용 역량을 객관적으로 증명할 수 있는 자격시험까지 기분 좋게 준비할 수 있도록옆에서 차근차근 함께하겠습니다."}], "price": "500,000원", "priceSub": "", "priceLabel": "원 수강료"}];

      + '<h1>배우고 끝나는 AI 말고,<br><em>바로 써먹는 AI</em></h1>'
      + '<p class="lead">바이브코딩, 업무자동화, AI 영상, 마케팅, 자격증까지. 실습과 결과물 중심으로 내 일에 바로 적용하는 AI 교육 과정입니다.</p>'
      + '<div class="pick2"><a href="#" data-cat="국비" class="p2 p2-g"><b>국비과정</b><span>정부 지원으로 배우는 장기 과정</span><em>' + nG + '개 과정 ›</em></a>'
      + '<a href="#" data-cat="일반" class="p2 p2-n"><b>일반과정</b><span>짧게 배우는 실무 AI 과정</span><em>' + nN + '개 과정 ›</em></a></div>'
      + '</div><aside class="contact-card"><small>과정 상담 문의</small><a class="tel" data-tel href="' + telHref + '">' + esc(MAIN_TEL) + (ext ? '<span>내선 ' + esc(ext) + '</span>' : '') + '</a>'
      + '<p>지금 수준과 목표에 맞는 과정을 1:1로 안내드립니다.</p>'
      + '<div class="stats"><div><b>' + nG + '</b><span>국비과정</span></div><div><b>' + nN + '</b><span>일반과정</span></div><div><b>1:1</b><span>맞춤 상담</span></div></div>'
      + '<button class="btn btn-main" data-contact style="width:100%;margin-top:18px">무료 상담 신청</button></aside></div></section>'
      + (k ? '<div class="wrap feat"><div class="feat-card" style="--dc:' + COLOR[k.dept] + '"><div class="feat-l"><span class="cat cat-g static">국비</span> <span class="badge"><i></i>모집중</span><h2>' + esc(k.title) + '</h2><p>' + esc(k.hook) + '</p><a class="btn btn-main" href="#' + k.id + '">과정 자세히 보기</a></div>'
          + '<div class="feat-r"><table>' + k.facts.map(function(f){ return '<tr><th>' + esc(f[0]) + '</th><td>' + esc(f[1]) + '</td></tr>'; }).join('') + '<tr><th>' + esc(k.priceLabel) + '</th><td>' + esc(k.price) + '</td></tr></table></div></div></div>' : '')
      + '<section class="sec" id="courses"><div class="wrap"><div class="sh"><h2>전체 과정</h2><p>과정을 누르면 상세 커리큘럼을 볼 수 있습니다</p></div>'
      + '<div class="cats" id="cats"></div><div class="chips" id="chips"></div><div id="lists"></div></div></section>';
    drawFilters(); drawLists();
    if(scrollTo){ var t = document.getElementById(scrollTo); if(t) t.scrollIntoView(); } else window.scrollTo(0, 0);
  }

  function drawFilters(){
    var nG = COURSES.filter(function(c){ return c.cat === '국비'; }).length;
    document.getElementById('cats').innerHTML = [['전체', '전체 보기', COURSES.length], ['국비', '국비과정', nG], ['일반', '일반과정', COURSES.length - nG]].map(function(x){
      return '<button class="ct ct-' + (x[0] === '국비' ? 'g' : x[0] === '일반' ? 'n' : 'a') + '" data-cat="' + x[0] + '" aria-pressed="' + (catF === x[0]) + '">' + x[1] + ' <small>' + x[2] + '</small></button>';
    }).join('');
    var pool = COURSES.filter(function(c){ return c.cat === '일반'; });
    var show = catF !== '국비';
    var depts = DEPTS.filter(function(d){ return pool.some(function(c){ return c.dept === d[0]; }); });
    document.getElementById('chips').innerHTML = show ? [['전체', '#16181d']].concat(depts).map(function(d){
      var n = d[0] === '전체' ? pool.length : pool.filter(function(c){ return c.dept === d[0]; }).length;
      return '<button class="chip" data-f="' + esc(d[0]) + '" style="--dc:' + d[1] + '" aria-pressed="' + (deptF === d[0]) + '">' + (d[0] === '전체' ? '일반과정 전체' : '<i></i>' + esc(d[0])) + ' <small>' + n + '</small></button>';
    }).join('') : '';
    document.getElementById('chips').style.display = show ? '' : 'none';
  }

  function drawLists(){
    var h = '';
    if(catF !== '일반'){
      var g = COURSES.filter(function(c){ return c.cat === '국비'; });
      h += '<div class="grp" id="grp-g"><div class="grp-h"><span class="cat cat-g static">국비</span><h3>국비과정</h3><p>정부 지원 · 내일배움카드로 수강하는 과정</p></div><div class="grid">' + g.map(card).join('') + '</div></div>';
    }
    if(catF !== '국비'){
      var n = COURSES.filter(function(c){ return c.cat === '일반' && (deptF === '전체' || c.dept === deptF); });
      h += '<div class="grp" id="grp-n"><div class="grp-h"><span class="cat cat-n static">일반</span><h3>일반과정</h3><p>짧은 기간 실습 위주로 배우는 AI 과정</p></div><div class="grid">' + n.map(card).join('') + '</div></div>';
    }
    h += '<p class="price-note">※ 일반과정 금액은 원 수강료, 국비과정 금액은 자부담금입니다. 재직자 할인, 프로모션 할인 등 추가 할인은 개인마다 다르기 때문에 상담 시 정확하게 안내드립니다.</p>';
    document.getElementById('lists').innerHTML = h;
  }

  // ---- 상세 본문 (원본 커리큘럼) ----
  var EMO = /^((?:<[^>]+>)*)(?:[\s☀-➿️‍]|[\uD83C-\uDBFF][\uDC00-\uDFFF])+/;
  function clean(h){ return String(h || '').replace(EMO, '$1'); }
  function bodyHTML(B){
    var h = '', i = 0, n = 0, toc = [];
    while(i < B.length){
      var b = B[i];
      if(b.t === 'li'){
        var s = '<ul>', lv = 0, q = !!b.q;
        while(i < B.length && B[i].t === 'li' && !!B[i].q === q){
          var x = B[i], xl = x.lv || 0;
          if(xl > lv){ s += '<ul>'; lv = xl; } else if(xl < lv){ s += '</ul>'; lv = xl; }
          s += '<li>' + clean(x.h) + '</li>'; i++;
        }
        if(lv) s += '</ul>';
        s += '</ul>';
        h += q ? '<blockquote>' + s + '</blockquote>' : s; continue;
      }
      if(b.q && b.t === 'p'){ var s2 = ''; while(i < B.length && B[i].q && B[i].t === 'p'){ s2 += '<p>' + B[i].h + '</p>'; i++; } h += '<blockquote>' + s2 + '</blockquote>'; continue; }
      if(b.t === 'h2' || b.t === 'h3' || b.t === 'h4'){
        var hh = clean(b.h), plain = hh.replace(/<[^>]+>/g, '').trim();
        if(!/[0-9A-Za-z가-힣]/.test(plain)){ i++; continue; }
        if(b.t === 'h2'){ var id = 'sec' + (++n); toc.push([id, plain]); h += '<h2 id="' + id + '">' + hh + '</h2>'; }
        else h += '<' + b.t + '>' + hh + '</' + b.t + '>';
        i++; continue;
      }
      if(b.t === 'img'){ h += '<figure><img src="' + esc(b.src) + '" alt="" loading="lazy" onerror="this.parentNode.remove()" style="width:' + Math.round((b.w || 1) * 100) + '%"></figure>'; i++; continue; }
      if(b.t === 'hr'){ if(h && !/<hr>$/.test(h)) h += '<hr>'; i++; continue; }
      if(b.t === 'table'){ h += '<div class="tbl"><table>' + b.rows.map(function(r){ return '<tr>' + r.map(function(x){ return '<td>' + esc(x) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>'; i++; continue; }
      h += '<p>' + b.h + '</p>'; i++;
    }
    return { h: h.replace(/(<hr>)+$/, ''), toc: toc };
  }

  function detailHTML(d){
    return '<div class="dx">'
      + '<section><h2>훈련 목표</h2>' + d.goal.map(function(t){ return '<p class="tx">' + esc(t) + '</p>'; }).join('') + '</section>'
      + '<section><h2>단계별 훈련 목표</h2><div class="phs">' + d.phases.map(function(p, i){
          return '<div class="ph3"><small>' + (i + 1) + '단계</small><b>' + esc(p[0]) + '</b><dl><div><dt>AI의 역할</dt><dd>' + esc(p[1]) + '</dd></div><div><dt>훈련생 영역</dt><dd>' + esc(p[2]) + '</dd></div></dl></div>';
        }).join('') + '</div></section>'
      + '<div class="dx2"><section><h2>사용 도구</h2><table class="tooltb">' + d.tools.map(function(t){ return '<tr><th>' + esc(t[0]) + '</th><td>' + esc(t[1]) + '</td></tr>'; }).join('') + '</table></section>'
      + '<section><h2>취업 목표</h2><p class="tx">' + esc(d.job) + '</p></section></div>'
      + '<div class="dx2"><section><h2>훈련기관 지원</h2><ul class="dash">' + d.support.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></section>'
      + '<section class="bgd"><h2>과정 개설 배경</h2>' + d.background.map(function(b){ return '<details><summary>' + esc(b[0]) + '</summary><p>' + esc(b[1]) + '</p></details>'; }).join('') + '</section></div>'
      + '</div>';
  }

  var DISC = '재직자 할인, 프로모션 할인 등 추가 할인은 개인마다 다르기 때문에 상담 시 정확하게 안내드립니다.';
  var DISC_G = '국비지원 과정으로 내일배움카드가 필요하며, 지원 자격은 상담 시 정확하게 확인해 드립니다.';
  function priceHTML(c){
    var items = c.priceItems ? '<table class="pr-items">' + c.priceItems.map(function(r){ return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('')
      + '<tr class="sum"><td>합계</td><td>' + esc(c.price) + '</td></tr></table>' : '';
    return '<div class="price"><div class="pr-top"><div class="pr-l"><span>' + esc(c.priceLabel) + '</span><b>' + esc(c.price) + '</b>' + (c.priceSub ? '<em>' + esc(c.priceSub) + '</em>' : '') + '</div>'
      + '<p>' + (c.cat === '국비' ? DISC_G : DISC) + '</p></div>' + items + '</div>';
  }

  function headHTML(c){
    return '<div class="d-head"><div><div class="d-tags">' + catTag(c).replace('class="cat', 'class="cat static') + '<span class="badge"><i></i>' + esc(c.dept) + (c.featured ? ' · 모집중' : '') + '</span></div>'
      + '<h1>' + esc(c.title) + '</h1><p class="hook">' + esc(c.hook) + '</p>'
      + '<dl class="facts">' + c.facts.map(function(f){ return '<div><dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd></div>'; }).join('') + '</dl>'
      + priceHTML(c)
      + '<div class="actions"><button class="btn btn-main" data-contact>이 과정 상담 신청</button><a class="btn btn-line" data-tel href="' + telHref + '">' + esc(telLabel) + '</a></div></div>'
      + cover(c) + '</div>';
  }

  function moreHTML(c){
    var others = COURSES.filter(function(x){ return x.cat === c.cat && x.dept === c.dept && x.id !== c.id; });
    others = others.concat(COURSES.filter(function(x){ return x.cat === c.cat && x.dept !== c.dept && x.id !== c.id; })).slice(0, 4);
    if(others.length < 4) others = others.concat(COURSES.filter(function(x){ return x.cat !== c.cat; })).slice(0, 4);
    return '<div class="more"><div class="sh"><h2>함께 보면 좋은 과정</h2></div><div class="grid">' + others.map(card).join('') + '</div></div>';
  }

  function renderCourse(c){
    var mid = '';
    if(c.detail){
      mid = '<div class="d-body"><div><h2>이런 분께 추천합니다</h2><ul class="dash">' + c.target.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'
        + '<div class="tools">' + c.tools.map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') + '</div>'
        + (c.note ? '<p class="note">' + esc(c.note) + '</p>' : '') + '</div>'
        + '<div><h2>교과편성</h2><div class="tl">' + c.steps.map(function(s, i){ return '<div class="st"><div><small>교과목 ' + (i + 1) + '</small><b>' + esc(s[0]) + '</b></div><div><p>' + esc(s[1]) + '</p>' + (s[2] ? '<ul class="units">' + s[2].map(function(u){ return '<li>' + esc(u) + '</li>'; }).join('') + '</ul>' : '') + '</div></div>'; }).join('') + '</div>'
        + '<div class="cta-box"><div><b>지원 자격 · 자부담 여부 확인</b><p>내일배움카드 발급부터 지원서 작성까지 1:1로 안내드립니다.</p></div><button class="btn btn-main" data-contact>이 과정 상담 신청</button></div></div></div>'
        + detailHTML(c.detail);
    } else if(c.body){
      var r = bodyHTML(c.body);
      mid = '<div class="full"><article class="prose">' + r.h
        + '<div class="cta-box" style="margin-top:44px"><div><b>이 과정이 궁금하다면</b><p>일정과 수강 방법을 1:1로 안내드립니다.</p></div><button class="btn btn-main" data-contact>이 과정 상담 신청</button></div></article>'
        + (r.toc.length ? '<aside class="toc"><h5>목차</h5>' + r.toc.map(function(t){ return '<a href="#" data-sec="' + t[0] + '">' + esc(t[1]) + '</a>'; }).join('') + '</aside>' : '') + '</div>';
    }
    app.innerHTML = '<div class="detail" style="--dc:' + COLOR[c.dept] + '"><div class="wrap"><a class="back" href="#">‹ 전체 과정</a>' + headHTML(c) + mid + moreHTML(c) + '</div></div>';
    document.getElementById('mSub').textContent = c.title;
    document.title = c.title + ' | AI캠퍼스';
    window.scrollTo(0, 0);
  }

  function route(scrollTo){
    var id = location.hash.slice(1);
    var c = COURSES.filter(function(x){ return x.id === id; })[0];
    document.getElementById('mSub').textContent = '편한 방법을 선택해 주세요';
    document.title = 'AI캠퍼스 | 실무에 바로 쓰는 AI 교육 과정';
    if(c) renderCourse(c); else renderHome(scrollTo);
  }

  function goHome(target){
    if(location.hash && location.hash !== '#'){ history.pushState(null, '', location.pathname + location.search); route(target); }
    else { var t = document.getElementById(target); if(t) t.scrollIntoView({behavior:'smooth'}); }
  }

  document.addEventListener('click', function(e){
    var cat = e.target.closest('[data-cat]');
    if(cat){ e.preventDefault(); catF = cat.dataset.cat; deptF = '전체';
      if(!document.getElementById('cats')) goHome('courses');
      drawFilters(); drawLists();
      if(cat.classList.contains('p2') || cat.closest('.links')) document.getElementById('courses').scrollIntoView({behavior:'smooth'});
      return; }
    var chip = e.target.closest('.chip');
    if(chip){ deptF = chip.dataset.f; drawFilters(); drawLists(); return; }
    var sec = e.target.closest('[data-sec]');
    if(sec){ e.preventDefault(); var t = document.getElementById(sec.dataset.sec); if(t) t.scrollIntoView({behavior:'smooth'}); return; }
    var go = e.target.closest('[data-go]');
    if(go){
      e.preventDefault();
      if(go.dataset.go === 'contact'){ document.getElementById('contact').scrollIntoView({behavior:'smooth'}); return; }
      catF = '전체'; deptF = '전체'; goHome(go.dataset.go);
      if(document.getElementById('cats')){ drawFilters(); drawLists(); }
      return;
    }
    if(e.target.closest('[data-contact]')) openM();
    if(e.target.closest('[data-close]')) closeM();
  });

  var m = document.getElementById('modal');
  function openM(){ m.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeM(){ m.classList.remove('open'); document.body.style.overflow = ''; }
  m.querySelectorAll('a.opt').forEach(function(a){ a.addEventListener('click', function(){ setTimeout(closeM, 300); }); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeM(); });

  window.addEventListener('hashchange', function(){ route(); });
  window.addEventListener('popstate', function(){ route(); });
  route();
})();
</script>
</body>
</html>
