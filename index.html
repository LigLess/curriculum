<!doctype html><html lang="ko"><head>
<title>AI캠퍼스 커리큘럼</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: white catalog — a soft grey index rail holding one rounded box per 학과, each course a rounded tile;
   white reading area on the right. Each 학과 owns one color, used only for small marks and tints. */
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --panel:#f6f7f9;        /* rail + quiet fills */
  --tile:#f1f3f6;
  --ink:#101318;
  --muted:#697080;
  --line:#e7e9ee;
  --accent:#101318;
  --accent-soft:#eef1f6;
  --quote:#f7f8fa;
  --callout:#f4f6f9;
  --shadow:0 1px 2px rgba(16,19,24,.04),0 6px 20px rgba(16,19,24,.06);
  --shadow-hi:0 2px 4px rgba(16,19,24,.05),0 14px 34px rgba(16,19,24,.10);
  --d-dev:#3b6cf6; --d-auto:#0f9f78; --d-content:#ec5a3a; --d-mkt:#d98b00; --d-cert:#8456f0;
  --f-display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1114; --surface:#16191e; --panel:#13161a; --tile:#1b1f25; --ink:#eceef2; --muted:#9aa1ad; --line:#262a31;
  --accent:#eceef2; --accent-soft:#1f242b; --quote:#16191e; --callout:#1a1e24;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hi:0 8px 28px rgba(0,0,0,.45);
  --d-dev:#7c9dff; --d-auto:#3fd0a3; --d-content:#ff8669; --d-mkt:#f2b445; --d-cert:#b394ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1114; --surface:#16191e; --panel:#13161a; --tile:#1b1f25; --ink:#eceef2; --muted:#9aa1ad; --line:#262a31;
  --accent:#eceef2; --accent-soft:#1f242b; --quote:#16191e; --callout:#1a1e24;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hi:0 8px 28px rgba(0,0,0,.45);
  --d-dev:#7c9dff; --d-auto:#3fd0a3; --d-content:#ff8669; --d-mkt:#f2b445; --d-cert:#b394ff; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.005em}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--dc,var(--accent));outline-offset:2px;border-radius:8px}

.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;padding:24px 18px 32px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;padding:4px 6px 8px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.02em;flex:none}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:600;line-height:1.3}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.rail a.home{display:flex;align-items:center;justify-content:space-between;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600}
.rail a.home.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail a.home span{font-family:var(--f-mono);font-size:12px;opacity:.7}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.group h4{margin:0 0 4px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:-.01em}
.group h4 .lbl{display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 8px;border-radius:999px;background:color-mix(in srgb,var(--dc) 12%,transparent);color:var(--dc)}
.group h4 .lbl i{width:7px;height:7px;border-radius:50%;background:var(--dc)}
.group h4 .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:500}
.rail a.item{display:block;text-decoration:none;padding:9px 12px;border-radius:11px;font-size:13.2px;line-height:1.45;color:var(--ink);background:var(--tile);border:1px solid transparent;transition:background .15s,border-color .15s,transform .15s}
.rail a.item:hover{background:color-mix(in srgb,var(--dc) 8%,var(--surface));border-color:color-mix(in srgb,var(--dc) 30%,transparent)}
.rail a.item.on{background:color-mix(in srgb,var(--dc) 10%,var(--surface));border-color:var(--dc);font-weight:600}
.rail a.item span{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.menu-btn{display:none}

main{min-width:0;padding-block:28px 80px;padding-inline:clamp(16px,4vw,56px)}

/* home */
.home-head{max-width:1100px;display:grid;gap:18px;margin-bottom:26px}
.home-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,44px);line-height:1.18;margin:0;letter-spacing:-.035em;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.home-head p{margin:0;color:var(--muted);max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:15px;color:var(--ink);margin-right:4px;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;max-width:420px;position:relative}
.search input{width:100%;font:inherit;padding:12px 16px 12px 42px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);transition:border-color .15s,background .15s}
.search input:focus{outline:none;background:var(--surface);border-color:var(--ink)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:12px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s}
.chip:hover{border-color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dc,var(--muted))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;max-width:1140px}
.card{display:flex;flex-direction:column;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
.card .cv{aspect-ratio:16/9;background:var(--tile);overflow:hidden;max-width:100%}
.card .cv img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--dc);background:color-mix(in srgb,var(--dc) 10%,transparent);padding:3px 10px 3px 8px;border-radius:999px;align-self:flex-start}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--dc)}
.card h3{margin:0;font-weight:700;font-size:17px;line-height:1.42;letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
.card .ft{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{padding:40px 0;color:var(--muted)}
.hit{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:6px 9px;border-radius:6px;line-height:1.5}
.hit mark{background:none;color:inherit;font-weight:700}

/* course page */
.course{max-width:1100px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:48px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.crumb a{text-decoration:none;color:var(--ink);font-weight:600}
.hero-img{border-radius:20px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:16/9;max-width:100%}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.c-title{font-weight:700;font-size:clamp(26px,3.4vw,38px);line-height:1.22;letter-spacing:-.035em;margin:22px 0 10px;text-wrap:balance}
.c-sum{font-size:17px;color:var(--muted);margin:0 0 20px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 14px}
.facts div{padding:14px 16px;background:var(--panel);border-radius:14px}

.facts dt{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.facts dd{margin:2px 0 0;font-weight:600}
.facts .big{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.metatable{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 30px}
.metatable th{text-align:left;font-weight:600;color:var(--muted);width:110px;padding:8px 12px 8px 0;vertical-align:top;white-space:nowrap}
.metatable td{padding:8px 0;border-bottom:1px solid var(--line)}
.metatable tr:first-child td{border-top:1px solid var(--line)}
.metatable tr:first-child th{border-top:1px solid var(--line)}

.prose{max-width:720px}
.prose h2{font-weight:700;font-size:23px;letter-spacing:-.025em;line-height:1.35;margin:44px 0 12px;scroll-margin-top:20px;text-wrap:balance}
.prose h3{font-size:18px;font-weight:700;margin:30px 0 8px;line-height:1.45;text-wrap:balance}
.prose h4{font-size:16px;font-weight:700;margin:22px 0 6px}
.prose p{margin:8px 0}
.prose ul{margin:6px 0 12px;padding-left:22px}
.prose ul ul{margin:2px 0}
.prose li{margin:3px 0}
.prose li::marker{color:var(--dc)}
.prose blockquote{margin:14px 0;padding:14px 18px;border-left:3px solid var(--dc);background:var(--quote);border-radius:0 12px 12px 0;font-weight:500}
.prose blockquote p{margin:4px 0}
.prose .callout{background:var(--callout);border-radius:12px;padding:12px 16px;margin:12px 0}
.prose .callout p{margin:3px 0}
.prose hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.prose figure{margin:18px 0}
.prose figure img{display:block;border-radius:14px;border:1px solid var(--line);margin:0 auto;background:#fff}
.prose b{font-weight:700}
.tbl{overflow-x:auto;margin:14px 0}
.tbl table{border-collapse:collapse;font-size:14px;min-width:100%}
.tbl td{border:1px solid var(--line);padding:8px 10px;vertical-align:top}
.tbl tr:first-child td{background:var(--quote);font-weight:600}
.slides{display:grid;gap:18px}
.slides figure{margin:0}
.slides img{width:100%;display:block;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.slides figcaption{font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--f-mono)}
.notice{font-size:13px;background:var(--callout);border-radius:8px;padding:10px 14px;color:var(--muted);margin-bottom:18px}

.toc{position:sticky;top:24px;align-self:start;max-height:calc(100vh - 48px);overflow:auto;font-size:13px}
.toc h5{margin:0 0 8px;font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.toc a{display:block;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:9px;line-height:1.45}
.toc a:hover{color:var(--ink);background:var(--panel)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{text-decoration:none;font-size:13px;color:var(--muted);max-width:48%;background:var(--panel);padding:12px 16px;border-radius:14px}
.pager a b{display:block;color:var(--ink);font-size:14.5px}
.print-tip{font-size:12.5px;color:var(--muted);margin-top:10px}

[data-d="개발"]{--dc:var(--d-dev)} [data-d="업무자동화"]{--dc:var(--d-auto)} [data-d="콘텐츠제작"]{--dc:var(--d-content)}
[data-d="마케팅&데이터"]{--dc:var(--d-mkt)} [data-d="자격증"]{--dc:var(--d-cert)}

@media (max-width:1180px){.course{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-102%);transition:transform .2s ease;background:var(--bg);padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;margin-bottom:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* print: only the course column, full width, nothing lazy */
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#ccc;--quote:#f4f4f4;--callout:#f1f1f1}
  html,body{background:#fff}
  .rail,.toc,.eyebrow,.menu-btn,.pager,.crumb,.print-tip,.tools{display:none!important}
  .shell{display:block}
  main{padding:0}
  .course{display:block;max-width:none}
  .prose{max-width:none}
  .card:hover{transform:none}
  figure,img,.facts,.facts div,.metatable,blockquote,.callout,.tbl{break-inside:avoid}
  h2,h3,h4{break-after:avoid}
  .slides figure{break-inside:avoid;page-break-inside:avoid}
  .hero-img{max-height:9cm}
  .prose figure img{max-height:20cm;object-fit:contain}
  body{font-size:11pt}
}
@page{margin:14mm 13mm}
</style></head><body>

<div class="shell">
  <nav class="rail" id="rail" aria-label="과정 목록"></nav>
  <main id="main"></main>
</div>

<script src="data.js"></script>
<script>
(function(){
const C = window.COURSES || [];
const DEPTS = ['개발','업무자동화','콘텐츠제작','마케팅&데이터','자격증'];
const rail = document.getElementById('rail'), main = document.getElementById('main');
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let state = {dept:'전체', q:''};
try{ const s = JSON.parse(localStorage.getItem('aicur-filter')||'null'); if(s) state = {...state, dept:s.dept||'전체'}; }catch(e){}

function cardFacts(c){
  if(c.deck) return `<span>강의 슬라이드</span><span class="mono">32장</span>`;
  return `<span>${c.instructor ? esc(c.instructor)+' 강사' : '&nbsp;'}</span><span class="mono">${c.hours? c.hours+'h':''}${c.sessions? ' · '+c.sessions+'회차':''}</span>`;
}

function renderRail(active){
  let h = `<a class="brand" href="#"><span class="logo">AI</span><span><small>KOREA AI CAMPUS</small><b>AI캠퍼스 커리큘럼</b></span></a>`;
  h += `<a class="home${active?'':' on'}" href="#">전체 과정 보기<span>${C.length}</span></a>`;
  DEPTS.forEach(d=>{
    const list = C.filter(c=>c.dept===d); if(!list.length) return;
    h += `<section class="group" data-d="${esc(d)}"><h4><span class="lbl"><i></i>${esc(d)}</span><span class="n">${list.length}개</span></h4>`;
    list.forEach(c=>{
      h += `<a class="item${c.id===active?' on':''}" href="#${c.id}">${esc(c.title)}${c.instructor?`<span>${esc(c.instructor)} 강사</span>`:''}</a>`;
    });
    h += `</section>`;
  });
  rail.innerHTML = h;
}

function snippet(c, q){
  if(!q) return '';
  const t = c.search; const i = t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0 || c.title.toLowerCase().includes(q.toLowerCase())) return '';
  const a = Math.max(0,i-28), s = t.slice(a, i+q.length+40);
  const k = s.toLowerCase().indexOf(q.toLowerCase());
  return `<div class="hit">…${esc(s.slice(0,k))}<mark>${esc(s.slice(k,k+q.length))}</mark>${esc(s.slice(k+q.length))}…</div>`;
}

function renderHome(){
  renderRail(null);
  const totalH = C.reduce((a,c)=>a+(c.hours||0),0);
  main.innerHTML = `
  <button class="menu-btn" type="button" id="menuBtn">☰ 과정 목록</button>
  <header class="home-head">
    <span class="eyebrow">KOREA AI CAMPUS · CURRICULUM</span>
    <h1>AI캠퍼스 과정 커리큘럼</h1>
    <div class="stats"><span><b>${C.filter(c=>!c.deck).length}</b>개 과정</span><span><b>${DEPTS.length}</b>개 학과</span>${C.some(c=>c.deck)?`<span><b>${C.filter(c=>c.deck).length}</b>개 강의안</span>`:''}</div>
    <div class="tools">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="과정명, 강사, 툴 이름으로 검색 (예: Supabase)" value="${esc(state.q)}" aria-label="과정 검색"></label>
      <div class="chips" role="group" aria-label="학과 필터">
        ${['전체',...DEPTS].map(d=>`<button class="chip" type="button" data-d="${esc(d)}" aria-pressed="${state.dept===d}">${d==='전체'?'':'<i></i>'}${esc(d)}</button>`).join('')}
      </div>
    </div>
  </header>
  <section class="grid" id="grid"></section>`;
  const draw = ()=>{
    const q = state.q.trim();
    const list = C.filter(c=>(state.dept==='전체'||c.dept===state.dept) && (!q || c.search.toLowerCase().includes(q.toLowerCase()) || c.title.toLowerCase().includes(q.toLowerCase())));
    document.getElementById('grid').innerHTML = list.length ? list.map(c=>`
      <a class="card" data-d="${esc(c.dept)}" href="#${c.id}">
        <div class="cv"><img src="${esc(c.cover)}" alt="" loading="eager"></div>
        <div class="bd">
          <span class="tag"><i></i>${esc(c.dept)}${c.deck?' · 강의안':''}</span>
          <h3>${esc(c.title)}</h3>
          <p>${esc(c.summary)}</p>
          ${snippet(c,q)}
          <div class="ft">${cardFacts(c)}</div>
        </div>
      </a>`).join('') : `<p class="empty">"${esc(q)}"에 맞는 과정이 없습니다. 다른 단어로 검색하거나 학과 필터를 '전체'로 바꿔 보세요.</p>`;
  };
  draw();
  document.getElementById('q').addEventListener('input', e=>{state.q=e.target.value; draw();});
  main.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    state.dept=b.dataset.d; main.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', x===b));
    try{localStorage.setItem('aicur-filter', JSON.stringify({dept:state.dept}))}catch(e){}
    draw();
  }));
  bindMenu();
}

function bodyHTML(c){
  let h='', i=0, n=0; const toc=[]; const B=c.body;
  while(i<B.length){
    const b=B[i];
    if(b.t==='li'){
      let s='<ul>', lv=0;
      while(i<B.length && B[i].t==='li' && !!B[i].q===!!b.q){
        const x=B[i]; const xl=x.lv||0;
        if(xl>lv){ s+='<ul>'; lv=xl; } else if(xl<lv){ s+='</ul>'; lv=xl; }
        s+=`<li>${x.h}</li>`; i++;
      }
      if(lv) s+='</ul>';
      s+='</ul>';
      h += b.q ? `<blockquote>${s}</blockquote>` : s; continue;
    }
    if(b.q && b.t==='p'){
      let s=''; while(i<B.length && B[i].q && B[i].t==='p'){ s+=`<p>${B[i].h}</p>`; i++; }
      h+=`<blockquote>${s}</blockquote>`; continue;
    }
    if(b.c && b.t==='p'){
      let s=''; while(i<B.length && B[i].c && B[i].t==='p'){ s+=`<p>${B[i].h}</p>`; i++; }
      h+=`<div class="callout">${s}</div>`; continue;
    }
    if(b.t==='h2'||b.t==='h3'||b.t==='h4'){
      const plain=b.h.replace(/<[^>]+>/g,'').trim();
      if(!/[0-9A-Za-z가-힣]/.test(plain)){ i++; continue; }
      if(b.t==='h2'){ const id='s'+(++n); toc.push([id,plain]); h+=`<h2 id="${id}">${b.h}</h2>`; }
      else h+=`<${b.t}>${b.h}</${b.t}>`;
      i++; continue;
    }
    if(b.t==='img'){ h+=`<figure><img src="${esc(b.src)}" alt="" style="width:${Math.round((b.w||1)*100)}%"></figure>`; i++; continue; }
    if(b.t==='hr'){ if(!/<hr>$/.test(h) && h) h+='<hr>'; i++; continue; }
    if(b.t==='table'){ h+=`<div class="tbl"><table>${b.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>`; i++; continue; }
    h+=`<p>${b.h}</p>`; i++;
  }
  h = h.replace(/(<hr>)+$/,'');
  return {h, toc};
}

function renderCourse(id){
  const c = C.find(x=>x.id===id); if(!c){ renderHome(); return; }
  renderRail(id);
  const k = C.indexOf(c), prev = C[k-1], next = C[k+1];
  const {h,toc} = c.deck ? {h:'',toc:[]} : bodyHTML(c);
  const facts = [];
  if(c.hours) facts.push(['총 교육시간', `<span class="big">${c.hours}</span> 시간`]);
  if(c.sessions) facts.push(['회차', `<span class="big">${c.sessions}</span> 회`]);
  if(c.hours&&c.sessions) facts.push(['회차당', `<span class="big">${Math.round(c.hours/c.sessions*10)/10}</span> 시간`]);
  facts.push(['학과', esc(c.dept)]);
  if(c.instructor) facts.push(['강사', esc(c.instructor)]);
  const metaRows = c.meta.filter(r=>r[1]);
  main.innerHTML = `
  <button class="menu-btn" type="button" id="menuBtn">☰ 과정 목록</button>
  <div class="course" data-d="${esc(c.dept)}">
    <article>
      <div class="crumb"><a href="#">전체 과정</a><span>/</span><span>${esc(c.dept)}</span></div>
      ${c.deck?'':`<div class="hero-img"><img src="${esc(c.cover)}" alt="${esc(c.title)} 대표 이미지"></div>`}
      <span class="tag" style="margin-top:20px;display:inline-flex"><i></i>${esc(c.dept)}${c.deck?' · 강의안':''}</span>
      <h1 class="c-title">${esc(c.title)}</h1>
      ${c.summary?`<p class="c-sum">${esc(c.summary)}</p>`:''}
      ${c.deck?'':`<dl class="facts">${facts.map(f=>`<div><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join('')}</dl>`}
      ${metaRows.length?`<table class="metatable">${metaRows.map(r=>`<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</table>`:''}
      ${c.deck ? `<div class="slides">${c.slides.map((s,j)=>`<figure><img src="${esc(s)}" alt="슬라이드 ${j+1}"><figcaption>${String(j+1).padStart(2,'0')} / ${c.slides.length}</figcaption></figure>`).join('')}</div>`
               : `<div class="prose">${h}</div>`}
      <nav class="pager">
        ${prev?`<a href="#${prev.id}">← 이전 과정<b>${esc(prev.title)}</b></a>`:'<span></span>'}
        ${next?`<a href="#${next.id}" style="text-align:right">다음 과정 →<b>${esc(next.title)}</b></a>`:''}
      </nav>
    </article>
    ${toc.length?`<aside class="toc"><h5>이 페이지 목차</h5>${toc.map(t=>`<a href="#${c.id}" data-s="${t[0]}">${esc(t[1])}</a>`).join('')}</aside>`:'<span></span>'}
  </div>`;
  main.querySelectorAll('.toc a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault(); document.getElementById(a.dataset.s)?.scrollIntoView({behavior:'smooth'});}));
  bindMenu();
  window.scrollTo(0,0);
}

function bindMenu(){
  const b=document.getElementById('menuBtn');
  if(b) b.onclick=(e)=>{e.stopPropagation(); rail.classList.toggle('open');};
}
document.addEventListener('click',e=>{ if(rail.classList.contains('open') && !rail.contains(e.target)) rail.classList.remove('open'); });
rail.addEventListener('click',e=>{ if(e.target.closest('a')) rail.classList.remove('open'); });

function route(){ const id=(location.hash||'').slice(1); if(/^c\d\d$/.test(id)) renderCourse(id); else renderHome(); }
window.addEventListener('hashchange', route);
route();
})();
</script>
</body></html>
